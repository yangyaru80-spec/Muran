<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日惊喜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            overflow: hidden;
            cursor: pointer;
        }

        /* ========== 背景动画 ========== */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #fed7aa 100%);
            animation: breathe 6s ease-in-out infinite;
            z-index: -2;
        }

        @keyframes breathe {
            0%, 100% {
                opacity: 0.95;
            }
            50% {
                opacity: 1;
            }
        }

        /* ========== 容器 ========== */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding: 20px;
        }

        .content {
            text-align: center;
            max-width: 600px;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 文本样式 ========== */
        .title {
            font-size: clamp(32px, 8vw, 56px);
            font-weight: 300;
            letter-spacing: 2px;
            color: #1f2937;
            margin-bottom: 40px;
            line-height: 1.4;
            min-height: 80px;
        }

        .title.final {
            font-size: clamp(36px, 10vw, 72px);
            font-weight: 400;
            animation: softGlow 0.8s ease-in;
        }

        @keyframes softGlow {
            0% {
                transform: scale(1);
                opacity: 0;
            }
            100% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        .subtitle {
            font-size: clamp(14px, 4vw, 18px);
            color: #6b7280;
            font-weight: 300;
            letter-spacing: 1px;
            min-height: 30px;
            margin-top: 20px;
        }

        /* ========== 按钮 ========== */
        .button {
            margin-top: 50px;
            padding: 16px 40px;
            font-size: clamp(14px, 4vw, 16px);
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
            color: white;
            cursor: pointer;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(244, 114, 182, 0.3);
            animation: slideUp 0.6s ease 0.2s backwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(244, 114, 182, 0.4);
        }

        .button:active {
            transform: scale(0.98);
        }

        .button.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

        /* ========== 爱心飘落 ========== */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 24px;
            opacity: 0.6;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) translateX(var(--tx));
                opacity: 0;
            }
        }

        /* ========== 背景变亮效果 ========== */
        .background.final-glow {
            background: linear-gradient(135deg, #fdf2f8 0%, #faf5ff 50%, #fef3c7 100%);
            animation: finalGlow 1s ease-in-out;
        }

        @keyframes finalGlow {
            0% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.1);
            }
            100% {
                filter: brightness(1.05);
            }
        }

        /* ========== 震动效果 ========== */
        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
