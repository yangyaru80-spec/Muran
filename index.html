<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mark ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
  font-family: 'Segoe UI', sans-serif;
  text-align: center;
  overflow: hidden;
}

h1 {
  font-size: 28px;
  min-height: 60px;
  color: #333;
}

button {
  margin-top: 20px;
  padding: 12px 25px;
  border-radius: 25px;
  border: none;
  background: #ff6b81;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

img {
  width: 220px;
  border-radius: 15px;
  margin-top: 20px;
  display: none;
  opacity: 0;
  transition: opacity 1s;
}

/* ❤️爱心 */
.heart {
  position: fixed;
  color: #ff6b81;
  animation: float 4s linear;
}

@keyframes float {
  from {transform: translateY(0); opacity:1;}
  to {transform: translateY(-700px); opacity:0;}
}
</style>
</head>

<body onclick="next()">

<div>
  <h1 id="text">Tap anywhere 💌</h1>
  <button onclick="next()">Continue</button>
  <br>
  <!-- ✅这里已经帮你换好图片 -->
  <img id="photo" src="mmexport1775756575498.jpg">
</div>

<script>
const messages = [
  "Today is a special day 🎂",
  "It's your birthday",
  "I was thinking what gift to give you...",
  "Nothing felt special enough",
  "So I made this… for you",
  "There is something I want to tell you...",
  "👉 I've liked you for a while ❤️"
];

let i = 0;
let typing = false;
let fullText = "";

function typeText(text) {
  let j = 0;
  typing = true;
  fullText = text;
  const el = document.getElementById("text");
  el.innerText = "";

  function typingEffect() {
    if (j < text.length) {
      el.innerText += text[j];
      j++;
      setTimeout(typingEffect, 40);
    } else {
      typing = false;
    }
  }

  typingEffect();
}

function next() {
  if (typing) {
    document.getElementById("text").innerText = fullText;
    typing = false;
    return;
  }

  if (i < messages.length) {
    typeText(messages[i]);
    i++;
  }

  // 📸照片出现（淡入）
  if (i === 5) {
    const img = document.getElementById("photo");
    img.style.display = "block";
    setTimeout(() => {
      img.style.opacity = 1;
    }, 100);
  }

  // 💥最后爱心爆发
  if (i === messages.length) {
    document.querySelector("button").style.display = "none";
    startHearts();
  }
}

// ❤️爱心动画
function startHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
  }, 200);
}
</script>

</body>
</html>
