<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mark ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(120deg, #ffd1dc, #c2e9fb);
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}

h1 {
  font-size: 26px;
  min-height: 60px;
}

button {
  margin-top: 20px;
  padding: 10px 20px;
  font-size: 16px;
  border: none;
  border-radius: 20px;
  background: #ff6b81;
  color: white;
  cursor: pointer;
}

button:active {
  transform: scale(0.95);
}

/* 爱心 */
.heart {
  position: fixed;
  color: #ff6b81;
  animation: float 4s linear;
}

@keyframes float {
  from {transform: translateY(0); opacity:1;}
  to {transform: translateY(-600px); opacity:0;}
}
</style>
</head>

<body>

<h1 id="text">Tap to start 💌</h1>
<button onclick="next()">Continue</button>

<script>
const messages = [
  "Today is a special day 🎂",
  "It's your birthday",
  "I was thinking what gift to give you...",
  "Nothing felt special enough",
  "So I made this just for you",
  "Maybe it's a bit silly",
  "But I really wanted to do it",
  "There is something I want to tell you...",
  "I think I like you ❤️"
];

let i = 0;
let typing = false;

function typeText(text) {
  let j = 0;
  typing = true;
  document.getElementById("text").innerText = "";

  function typingEffect() {
    if (j < text.length) {
      document.getElementById("text").innerText += text[j];
      j++;
      setTimeout(typingEffect, 40);
    } else {
      typing = false;
    }
  }

  typingEffect();
}

function next() {
  if (typing) return;

  if (i < messages.length) {
    typeText(messages[i]);
    i++;
  }

  if (i === messages.length) {
    document.querySelector("button").style.display = "none";
    startHearts();
  }
}

function startHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
  }, 300);
}
</script>

</body>
</html>
