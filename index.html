<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: black;
  color: white;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}

/* 容器 */
.container {
  max-width: 90%;
  z-index: 2;
}

/* 标题 */
h1 {
  font-size: 28px;
  min-height: 60px;
}

/* 按钮 */
button {
  margin-top: 30px;
  padding: 12px 30px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg,#ff6b81,#ff9a9e);
  color: white;
  cursor: pointer;
}

/* 图片 */
.photo {
  width: 220px;
  border-radius: 20px;
  margin-top: 20px;
  display: none;
  box-shadow: 0 0 40px rgba(255,105,135,0.8);
}

/* 爱心 */
.heart {
  position: fixed;
  color: #ff6b81;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% {transform: translateY(0); opacity:1;}
  100% {transform: translateY(-800px); opacity:0;}
}

/* 渐入 */
.fade {
  animation: fadeIn 1.5s;
}

@keyframes fadeIn {
  from {opacity:0;}
  to {opacity:1;}
}

/* 黑屏渐亮 */
body::before {
  content:"";
  position: fixed;
  width:100%;
  height:100%;
  background:black;
  animation: openScene 2s forwards;
}

@keyframes openScene {
  from {opacity:1;}
  to {opacity:0;}
}
</style>
</head>

<body>

<div class="container">
  <h1 id="text"></h1>
  <img src="mmexport1775756575498.jpg" class="photo" id="photo">
  <button onclick="next()">Tap to continue</button>
</div>

<!-- 音乐（自动播放） -->
<audio id="music" loop>
  <source src="https://www.ytmp3.cn/down/77761.mp3" type="audio/mpeg">
</audio>

<script>

const messages = [
  "Hey...",
  "Today is a special day 🎂",
  "I thought a lot about what to give you",
  "Something normal didn't feel enough",
  "So I made this just for you",
  "Because you are special to me",
  "And there is something I want to tell you...",
  "...",
  "I think...",
  "I really like you ❤️"
];

let index = 0;
let typing = false;

/* 打字效果 */
function typeText(text, i = 0) {
  const el = document.getElementById("text");
  if (i < text.length) {
    el.innerHTML += text.charAt(i);
    setTimeout(() => typeText(text, i + 1), 50);
  } else {
    typing = false;
  }
}

/* 点击逻辑 */
function next() {
  if (typing) return;

  const el = document.getElementById("text");
  el.innerHTML = "";
  el.classList.add("fade");

  typing = true;

  if (index < messages.length) {
    typeText(messages[index]);
    index++;
  }

  // 显示照片
  if (index === 5) {
    document.getElementById("photo").style.display = "block";
  }

  // 播放音乐（必须用户点击触发）
  if (index === 2) {
    document.getElementById("music").play();
  }

  // 最终效果
  if (index === messages.length) {
    document.querySelector("button").style.display = "none";
    startHearts();
  }
}

/* 爱心动画 */
function startHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.fontSize = Math.random() * 20 + 20 + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }, 300);
}

/* 初始加载 */
setTimeout(() => {
  next();
}, 1000);

</script>

</body>
</html>
