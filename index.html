<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: black;
  color: white;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
  transition: background 2s;
}

.container {
  max-width: 90%;
}

/* 文字 */
h1 {
  font-size: 28px;
  min-height: 60px;
  transition: all 0.5s;
}

/* 按钮 */
button {
  margin-top: 30px;
  padding: 12px 30px;
  font-size: 18px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(45deg,#ff6b81,#ff9a9e);
  color: white;
  cursor: pointer;
}

/* 图片 */
.photo {
  width: 240px;
  border-radius: 20px;
  margin-top: 20px;
  display: none;
  opacity: 0;
  transform: scale(0.8);
  transition: all 1.5s;
  box-shadow: 0 0 60px rgba(255,100,150,0.8);
}

/* 爱心 */
.heart {
  position: fixed;
  color: #ff6b81;
  animation: float 6s linear infinite;
}

@keyframes float {
  from {transform: translateY(0); opacity:1;}
  to {transform: translateY(-900px); opacity:0;}
}

/* 心跳效果 */
@keyframes heartbeat {
  0% {transform: scale(1);}
  50% {transform: scale(1.05);}
  100% {transform: scale(1);}
}

.heartbeat {
  animation: heartbeat 1s infinite;
}
</style>
</head>

<body>

<div class="container">
  <h1 id="text">Tap to start 💌</h1>
  <img src="mmexport1775756575498.jpg" class="photo" id="photo">
  <button onclick="next()">Start</button>
</div>

<!-- 🎵音乐 -->
<audio id="music">
  <source src="https://www.ytmp3.cn/down/77761.mp3" type="audio/mpeg">
</audio>

<script>

const messages = [
  "Hey...",
  "I didn't know what to give you 🎂",
  "So I made something different",
  "Something just for you",
  "Because you are special to me",
  "And maybe...",
  "This is a bit scary to say",
  "...",
  "But I don't want to hide it anymore",
  "I really like you ❤️"
];

let index = 0;
let typing = false;
let musicPlayed = false;

/* 打字 */
function typeText(text, i = 0) {
  const el = document.getElementById("text");
  if (i < text.length) {
    el.innerHTML += text.charAt(i);
    setTimeout(() => typeText(text, i + 1), 50);
  } else {
    typing = false;
  }
}

/* 点击 */
function next() {
  if (typing) return;

  const el = document.getElementById("text");
  el.innerHTML = "";
  typing = true;

  if (index < messages.length) {
    typeText(messages[index]);
    index++;
  }

  // 📸照片出现
  if (index === 5) {
    const img = document.getElementById("photo");
    img.style.display = "block";
    setTimeout(() => {
      img.style.opacity = 1;
      img.style.transform = "scale(1)";
    }, 200);
  }

  // 🎵音乐触发（最后阶段）
  if (index === messages.length - 1 && !musicPlayed) {
    document.getElementById("music").play();
    musicPlayed = true;
  }

  // 💥最终爆发
  if (index === messages.length) {

    document.querySelector("button").style.display = "none";

    // 背景变亮
    document.body.style.background = "linear-gradient(135deg,#ff9a9e,#fad0c4)";

    // 心跳
    el.classList.add("heartbeat");

    // 放大文字
    el.style.fontSize = "34px";

    startHearts();
  }
}

/* ❤️爱心 */
function startHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.fontSize = Math.random() * 20 + 20 + "px";
    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),6000);
  }, 200);
}
</script>

</body>
</html>
