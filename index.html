<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mark ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
  background: linear-gradient(270deg, #fbc2eb, #a6c1ee, #ffd1dc);
  background-size: 600% 600%;
  animation: bgMove 12s ease infinite;
}

/* 🌈背景流动 */
@keyframes bgMove {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

/* 💌卡片 */
.card {
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(10px);
  padding: 30px;
  border-radius: 20px;
  width: 85%;
  max-width: 320px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h1 {
  font-size: 24px;
  min-height: 60px;
  color: #333;
}

/* 按钮 */
button {
  margin-top: 15px;
  padding: 10px 20px;
  border-radius: 20px;
  border: none;
  background: #ff6b81;
  color: white;
  cursor: pointer;
}

/* 📸图片 */
img {
  width: 100%;
  border-radius: 15px;
  margin-top: 15px;
  display: none;
  opacity: 0;
  transform: scale(0.8);
  transition: all 1s;
}

/* ❤️爱心 */
.heart {
  position: fixed;
  color: #ff6b81;
  font-size: 20px;
  animation: floatUp 5s linear;
}

@keyframes floatUp {
  from {transform: translateY(0); opacity:1;}
  to {transform: translateY(-800px); opacity:0;}
}

/* ✨点击光点 */
.spark {
  position: fixed;
  width: 6px;
  height: 6px;
  background: white;
  border-radius: 50%;
  animation: spark 1s linear;
}

@keyframes spark {
  to {
    transform: translateY(-50px);
    opacity: 0;
  }
}
</style>
</head>

<body onclick="next(event)">

<div class="card">
  <h1 id="text">Tap anywhere 💌</h1>
  <button onclick="next(event)">Continue</button>
  <img id="photo" src="mmexport1775756575498.jpg">
</div>

<!-- 🎵告白气球 -->
<iframe id="music" width="0" height="0"
src="https://music.163.com/outchain/player?type=2&id=436514312&auto=0">
</iframe>

<script>
const messages = [
  "Today is a special day 🎂",
  "It's your birthday",
  "I was thinking about you...",
  "About how to surprise you",
  "So I made this… just for you",
  "There is something I want to tell you...",
  "I think I like you ❤️"
];

let i = 0;
let typing = false;
let fullText = "";
let musicPlayed = false;

function typeText(text) {
  let j = 0;
  typing = true;
  fullText = text;
  const el = document.getElementById("text");
  el.innerText = "";

  function typingEffect() {
    if (j < text.length) {
      el.innerText += text[j];
      j++;
      setTimeout(typingEffect, 40);
    } else {
      typing = false;
    }
  }
  typingEffect();
}

function next(e) {

  // ✨点击光点效果
  if(e){
    const spark = document.createElement("div");
    spark.className = "spark";
    spark.style.left = e.clientX + "px";
    spark.style.top = e.clientY + "px";
    document.body.appendChild(spark);
    setTimeout(()=>spark.remove(),1000);
  }

  if (typing) {
    document.getElementById("text").innerText = fullText;
    typing = false;
    return;
  }

  if (i < messages.length) {
    typeText(messages[i]);
    i++;
  }

  // 📸照片出现（更高级）
  if (i === 5) {
    const img = document.getElementById("photo");
    img.style.display = "block";
    setTimeout(() => {
      img.style.opacity = 1;
      img.style.transform = "scale(1)";
    }, 100);
  }

  // 🎵最后播放音乐
  if (i === messages.length && !musicPlayed) {
    document.getElementById("music").src += "&auto=1";
    musicPlayed = true;
  }

  // ❤️结尾效果
  if (i === messages.length) {
    startHearts();
  }
}

// ❤️爱心
function startHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
  }, 300);
}
</script>

</body>
</html>
